
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Recipes</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="text-white text-center p-4">
        <h1>Recipe Finder</h1>
        <p>Search for your favorite recipes!</p>
    </header>

    <nav class="navbar navbar-expand bg-light">
        <div class="container">
            <a class="navbar-brand" href="index.html">Recipe Finder</a>

            <div class="navbar-nav">
                <a class="nav-link" href="index.html">Home</a>
                <a class="nav-link" href="search.html">Search</a>
                <a class="nav-link" href="contact.html">Contact</a>
                <a class="nav-link" href="members.html">Group Members</a>
            </div>
        </div>
    </nav>

    <main class="container mt-4 text-center">
        <h2>Search for Recipes</h2>

        <p>Enter a food or ingredient to find recipes.</p>

        <div class="mb-3">
            <label for="recipeInput" class="form-label">Recipe Name</label>
            <input type="text" id="recipeInput" class="form-control" placeholder="Enter a food">
        </div>

        <button id="searchBtn" class="btn recipe-btn">
            Search
        </button>

        <div id="results" class="mt-4"></div>
    </main>

    <footer class="text-center mt-5 p-3 bg-light">
        <p>Recipe Finder</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
